// ─────────────────────────────────────────────
// LUSTIG SCORE
// ─────────────────────────────────────────────
function calcLustig(meals,sugar){
  if(!meals||!meals.length)return{score:0,label:"No data",color:"#94a3b8"};
  let weighted=0,totalWeight=0;
  meals.forEach(m=>{
    const weight=Math.max(50,Number(m.cal)||0);
    weighted+=lustigValue(m)*weight;
    totalWeight+=weight;
  });
  const avg=totalWeight?weighted/totalWeight:0;
  const sugarAdjustment=sugar<=25?0.5:sugar<=35?0:sugar<=50?-1:sugar<=75?-2:-3;
  const sc=Math.max(0,Math.min(10,Math.round(((avg+2)/4)*10+sugarAdjustment)));
  return{score:sc,label:sc>=8?"Excellent":sc>=6?"Good":sc>=4?"Fair":"Poor",color:sc>=8?"#10b981":sc>=6?"#f59e0b":sc>=4?"#f97316":"#ef4444"};
}

const isCoffee=(name)=>COFFEE_RE.test(name||"");

// Lustig-style heuristic: favor low sugar and protein-dense whole foods;
// penalize high sugar load, low-protein calories, and obvious processed foods.
// This is a food-quality guide, not a clinical score.
const WHOLE_FOOD_RE=/\b(chicken|beef|salmon|fish|egg|yogurt|oat|rice|nut|peanut|cheese|vegetable|fruit|bean|lentil)\b/i;
const PROCESSED_FOOD_RE=/\b(chocolate|kitkat|croissant|toasts?|pastry|candy|sweets?|cookie|biscuit|cake|donut|doughnut|gainer|protein bar|tortilla|chips?|cheese balls?|soda|cola|energy drink)\b/i;
function lustigValue(m){
  const cal=Math.max(0,Number(m?.cal)||0),protein=Math.max(0,Number(m?.protein)||0),sugar=Math.max(0,Number(m?.sugar)||0);
  const sugarShare=cal>0?(sugar*4)/cal:0,proteinShare=cal>0?(protein*4)/cal:0;
  let value=0;
  if(sugar<=5&&sugarShare<=0.1)value+=1;
  else if(sugar>25||sugarShare>0.3)value-=2;
  else if(sugar>12||sugarShare>0.18)value-=1;
  if(protein>=20||proteinShare>=0.25)value+=1;
  else if(cal>=250&&proteinShare<0.08)value-=1;
  if(PROCESSED_FOOD_RE.test(m?.name||""))value-=1;
  else if(WHOLE_FOOD_RE.test(m?.name||""))value+=1;
  return Math.max(-2,Math.min(2,value));
}

async function callProxy(payload){
  // The proxy authorizes requests by their origin (this app's domain), so no key
  // is needed. A previously stored key is still sent if present, for compatibility.
  const h={"Content-Type":"application/json"};
  try{const k=localStorage.getItem("ath_app_key");if(k)h["x-app-key"]=k;}catch{}
  return fetch(PROXY_URL,{method:"POST",headers:h,body:JSON.stringify(payload)});
}

async function estimateMacros(name){
  try{
    const res=await callProxy({model:"claude-haiku-4-5-20251001",max_tokens:300,messages:[{role:"user",content:`Estimate macros for: "${name}". Reply ONLY with a JSON object, no markdown, no explanation. Format: {"cal":300,"protein":25,"sugar":5,"fat":10}`}]});
    const data=await res.json();
    const text=data.content?.[0]?.text||"{}";
    return JSON.parse(text.replace(/```json|```/g,"").trim());
  }catch(e){console.error("estimateMacros error:",e);return null;}
}

async function analyzePhoto(b64,mime){
  const res=await callProxy({model:"claude-haiku-4-5-20251001",max_tokens:1000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mime,data:b64}},{type:"text",text:`Identify all food items in this photo and estimate macros per item. Reply ONLY with a JSON array, no markdown, no explanation. Format: [{"name":"Food Name","cal":300,"protein":25,"sugar":5,"fat":10}]. If no food detected, return [].`}]}]});
  const data=await res.json();
  if(!res.ok)throw new Error(data?.error?.message||"The photo analysis service rejected this image.");
  const text=data.content?.[0]?.text;
  if(!text)throw new Error("The photo analysis service returned no result.");
  const items=JSON.parse(text.replace(/```json|```/g,"").trim());
  if(!Array.isArray(items))throw new Error("The photo analysis result was invalid.");
  return items;
}

// Gallery photos can be HEIC/HEIF and are often too large for the API request.
// Decode them in the browser, resize them, and always send a supported JPEG.
async function preparePhoto(file){
  if(!file)throw new Error("No photo selected.");
  const looksLikeImage=(file.type||"").startsWith("image/")||/\.(heic|heif|jpe?g|png|gif|webp)$/i.test(file.name||"");
  if(!looksLikeImage)throw new Error("Please choose an image file.");

  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{
      const el=new Image();
      el.onload=()=>resolve(el);
      el.onerror=()=>reject(new Error("This photo format could not be opened. Try exporting it as JPEG."));
      el.src=url;
    });
    const maxDimension=1600;
    const scale=Math.min(1,maxDimension/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=canvas.getContext("2d");
    if(!ctx)throw new Error("This browser could not prepare the photo.");
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const dataUrl=canvas.toDataURL("image/jpeg",0.85);
    const b64=dataUrl.split(",")[1];
    if(!b64)throw new Error("This browser could not prepare the photo.");
    return{b64,mime:"image/jpeg"};
  }finally{
    URL.revokeObjectURL(url);
  }
}

// TREND LINE CHART (Log tab)
// Multi-series SVG line chart. Each series is auto-scaled to its own max over
// the visible window, so macros (kcal) and sugar (g) are comparable as trends.
// ─────────────────────────────────────────────
function TrendChart({data,metrics,hidden,onToggle}){
  const W=320,H=140,padL=6,padR=6,padT=8,padB=18;
  const n=data.length;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const xAt=(i)=>n<=1?padL+innerW/2:padL+i*innerW/(n-1);
  const hasValue=(v)=>Number.isFinite(v);
  const maxOf=(k)=>Math.max(1,...data.map(d=>d[k]).filter(hasValue));
  const yAt=(v,k)=>padT+innerH*(1-(v/maxOf(k)));
  const path=(m)=>{let drawing=false;return data.map((d,i)=>{const v=d[m.key];if(!hasValue(v)){drawing=false;return"";}const cmd=drawing?"L":"M";drawing=true;return`${cmd}${xAt(i).toFixed(1)} ${yAt(v,m.key).toFixed(1)}`;}).filter(Boolean).join(" ");};
  const latestFor=(k)=>{for(let i=n-1;i>=0;i--)if(hasValue(data[i][k]))return{point:data[i],index:i};return null;};
  const fmtX=(dk)=>{const d=new Date(dk+"T12:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});};
  const visible=metrics.filter(m=>!hidden[m.key]);
  const xIdx=n<=1?[0]:[0,Math.floor((n-1)/2),n-1];
  const validDays=data.filter(d=>hasValue(d.cal)).length;
  return h("div",null,

}

function FinishModal({day,exs,date,rebootStreak,onClose,onSave}){
  const tot=day.meals.reduce((a,m)=>({cal:a.cal+(m.cal||0),protein:a.protein+(m.protein||0),sugar:a.sugar+(m.sugar||0),fat:a.fat+(m.fat||0)}),{cal:0,protein:0,sugar:0,fat:0});
  const o3=(day.meals.reduce((a,m)=>a+(m.omega3||0),0)+day.omega3).toFixed(2);
  const lustig=calcLustig(day.meals,tot.sugar);
  const [copied,setCopied]=useState(false);

  const mealLines=day.meals.map(m=>`  - ${m.name}: ${m.cal}kcal, ${m.protein}g P, ${m.sugar}g S`).join("\n")||"  None logged";
  const exLines=exs.map(e=>`  - ${e.name}: ${e.sets}x${e.reps}${!e.unit.includes("BW")&&!e.unit.includes("−")?" @ "+e.weight+e.unit:""} ${e.done?"✓":""}${e.note?" ["+e.note+"]":""}`).join("\n")||"  Rest day";

  const summary=`DAY FINISHED — ${date}
Weight: ${day.weight||"—"}kg | Sleep: ${day.sleepScore||"—"} | Bedtime: ${day.bedtime||"—"}
Calories: ${Math.round(tot.cal)}kcal | Protein: ${Math.round(tot.protein)}g | Sugar: ${Math.round(tot.sugar)}g
Omega-3: ${o3}g | Coffees: ${day.coffees} | L-Theanine: ${day.ltheanine}mg | Creatine: ${day.creatine}mg | Magnesium: ${day.magnesium||0}mg | Electrolytes: ${day.electrolytes?"yes":"no"}
Lustig Score: ${lustig.score}/10 (${lustig.label}) | Reboot streak: ${rebootStreak} days
Meals:
${mealLines}
Training (${exs.filter(e=>e.done).length}/${exs.length} done):
${exLines}${day.notes?"\nNotes:\n  "+day.notes:""}`;

  const doCopy=()=>{
    const done=()=>{setCopied(true);saveDay(date,{...day,exs,finalized:true});onSave({tot,o3,lustig});setTimeout(()=>setCopied(false),5000);};
    navigator.clipboard.writeText(summary).then(done).catch(()=>{
      const ta=document.getElementById("fin-ta");
      if(ta){ta.select();document.execCommand("copy");}
      done();
    });
  };

  return h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:200,display:"flex",alignItems:"flex-end"},onClick:onClose},
    h("div",{onClick:e=>e.stopPropagation(),style:{background:"#fff",borderRadius:"20px 20px 0 0",padding:20,width:"100%",maxWidth:480,margin:"0 auto",maxHeight:"88vh",overflowY:"auto"}},
      h("div",{style:{width:40,height:4,background:"#e2e8f0",borderRadius:2,margin:"0 auto 16px"}}),
      h("h2",{style:{fontSize:18,fontWeight:800,marginBottom:4}},"Finish Day"),
      h("p",{style:{fontSize:12,color:"#64748b",marginBottom:12}},"Copy this summary and paste it into Claude chat — Claude will sync to Notion."),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}},
        h("div",{style:{background:"#f0fdf4",borderRadius:10,padding:10,textAlign:"center"}},
          h("div",{style:{fontSize:10,color:"#16a34a"}},"Lustig Score"),
          h("div",{style:{fontSize:22,fontWeight:800,color:lustig.color}},lustig.score,h("span",{style:{fontSize:12}},"/10")),
          h("div",{style:{fontSize:10,color:"#64748b"}},lustig.label)
        ),
        h("div",{style:{background:"#eff6ff",borderRadius:10,padding:10,textAlign:"center"}},
          h("div",{style:{fontSize:10,color:"#2563eb"}},"Reboot Streak"),
          h("div",{style:{fontSize:22,fontWeight:800,color:"#2563eb"}},rebootStreak,h("span",{style:{fontSize:12}},"d")),
          h("div",{style:{fontSize:10,color:"#64748b"}},"Keep going!")
        )
      ),
      h("textarea",{id:"fin-ta",readOnly:true,value:summary,style:{width:"100%",height:200,padding:"10px 12px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:11,lineHeight:1.7,color:"#475569",background:"#f8fafc",resize:"none",outline:"none",fontFamily:"monospace"}}),
      h("button",{onClick:doCopy,style:{...btn(copied?"#10b981":"#0f172a","white"),width:"100%",padding:14,fontSize:14,marginTop:10,borderRadius:12,transition:"background 0.2s"}},
        copied?"✓ Copied! Paste into Claude chat →":"📋 Copy Summary"
      ),
      copied&&h("div",{style:{marginTop:8,padding:"10px 12px",borderRadius:10,background:"#f0fdf4",fontSize:12,color:"#16a34a",textAlign:"center",fontWeight:600}},"Now paste this in Claude chat — Claude will sync to Notion ✅"),
      h("button",{onClick:onClose,style:{...btn("#f1f5f9","#475569"),width:"100%",padding:12,marginTop:8,borderRadius:12}},copied?"Close":"Cancel")
    )
  );
}

        if(!r.ok){if(authFailure(r.status,function(){send(k,current(k),keepalive);}))return false;throw new Error('Supabase returned '+r.status);}
        if(current(k)===v){lastSent[k]=v;delete dirty[k];}
        emit(Object.keys(dirty).length?'syncing':'synced',Object.keys(dirty).length?'More changes pending':'All changes saved');
        return true;
      }).catch(function(e){dirty[k]=true;emit(navigator.onLine?'error':'offline',navigator.onLine?e.message:'Offline — changes are saved on this device');return false;});
  }
  function queue(k,delay){
    dirty[k]=true;clearTimeout(pending[k]);
    pending[k]=setTimeout(function(){delete pending[k];var v=current(k);if(v!==null&&v!==lastSent[k])send(k,v);},delay==null?1200:delay);
  }
  Storage.prototype.setItem=function(k,v){
    _set.call(this,k,v);
    if(this===localStorage&&tracked(k)&&v!==lastSent[k]){markTs(k,Date.now());queue(k,ready?1200:2500);}
  };
  function applyRows(rows,isDay){
    var changed=false;
    rows.forEach(function(r){
      var suffix=isDay?r.date_key:r.key;if(!suffix)return;
      var k=(isDay?'d4_':'g4_')+suffix,remote=JSON.stringify(isDay?r.data:r.value),remoteTs=Date.parse(r.updated_at)||0,local=current(k),localTime=localTs(k);
      if(local===null||localTime<=remoteTs){
        if(local!==remote){_set.call(localStorage,k,remote);changed=true;}
        markTs(k,remoteTs);lastSent[k]=remote;delete dirty[k];clearTimeout(pending[k]);delete pending[k];
      }else if(local!==remote){queue(k,0);}
      else{lastSent[k]=local;delete dirty[k];}
    });
    return changed;
  }
  function loadTable(path,isDay){
    return fetch(S+'/rest/v1/'+path+'?user_id=eq.'+U+'&select='+(isDay?'date_key,data,updated_at':'key,value,updated_at'),{headers:hdr()})
      .then(function(r){if(!r.ok){if(authFailure(r.status,start))return [];throw new Error('Supabase returned '+r.status);}return r.json();})
      .then(function(rows){if(!Array.isArray(rows))throw new Error('Invalid sync response');return applyRows(rows,isDay);});
  }
  function start(){
    emit(navigator.onLine?'syncing':'offline',navigator.onLine?'Checking for newer data…':'Offline — using saved device data');
    if(!navigator.onLine){ready=true;return;}
    Promise.all([loadTable('athlete_day_data',true),loadTable('athlete_globals',false)])
      .then(function(changed){ready=true;if(changed.some(Boolean)&&window.__athleteReload)window.__athleteReload();Object.keys(dirty).forEach(function(k){queue(k,0);});if(!Object.keys(dirty).length)emit('synced','All changes saved');})
      .catch(function(e){ready=true;emit('error',e.message);});
  }
  window.__athleteRetrySync=function(){Object.keys(dirty).forEach(function(k){queue(k,0);});if(!Object.keys(dirty).length)start();};
  window.addEventListener('online',window.__athleteRetrySync);
  window.addEventListener('offline',function(){emit('offline','Offline — changes are saved on this device');});
  window.addEventListener('pagehide',function(){Object.keys(dirty).forEach(function(k){clearTimeout(pending[k]);var v=current(k);if(v!==null&&v!==lastSent[k])send(k,v,true);});});
  window.addEventListener('load',start);
})();
</script>
